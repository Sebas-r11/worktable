# Blueprint opcional para Render (demo gratis con SQLite).
# También puedes crear el servicio manualmente siguiendo DEPLOY-DEMO.md
#
# Uso: Render Dashboard → New → Blueprint → conectar repo

services:
  - type: web
    name: flexop-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: chmod +x render-start.sh && ./render-start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: flexop-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://TU-APP.vercel.app
      - key: POPULATE_SCALE
        value: demo
      - key: SERVE_MEDIA
        value: '1'
