name: Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'flexop-frontend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'flexop-frontend/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flexop
          POSTGRES_PASSWORD: flexop_test
          POSTGRES_DB: flexop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://flexop:flexop_test@localhost:5432/flexop_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (token blacklist)
        run: python manage.py migrate --noinput

      - name: Pytest with coverage
        run: |
          pytest --cov=usuarios --cov=operaciones --cov=metricas \
            --cov=ordenes --cov=maquinas --cov=alertas \
            --cov=reasignaciones --cov=reportes \
            --cov-report=term-missing --cov-fail-under=30

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flexop-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flexop-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Vitest coverage (umbral mínimo)
        run: npm run test:coverage

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flexop
          POSTGRES_PASSWORD: flexop_test
          POSTGRES_DB: flexop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://flexop:flexop_test@localhost:5432/flexop_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flexop-frontend/package-lock.json

      - name: Backend deps and DB
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python populate_db.py

      - name: Frontend deps and Playwright
        working-directory: flexop-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: flexop-frontend
        env:
          CI: true
        run: npm run test:e2e
